name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10 and 11 no longer get security fixes, so Composer refuses
          # them unless advisories are allowed; only these test installs do that.
          - php: '8.1'
            laravel: '10.*'
            end_of_life: true
          - php: '8.2'
            laravel: '11.*'
            end_of_life: true
          - php: '8.3'
            laravel: '12.*'
          - php: '8.4'
            laravel: '13.*'
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - if: matrix.end_of_life
        run: composer config policy.advisories.block false
      - run: composer require "illuminate/support:${{ matrix.laravel }}" --dev --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
